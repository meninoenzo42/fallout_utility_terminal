<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Primeiro Site no GitHub Pages</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col items-center justify-center p-6 font-sans">

  <main class="max-w-md w-full bg-slate-800/80 backdrop-blur-sm border border-slate-700 rounded-2xl shadow-xl p-8 text-center space-y-6">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/20 text-indigo-400 mb-2">
      <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
    </div>

    <div class="space-y-2">
      <h1 class="text-2xl font-bold text-white tracking-tight">GitHub Pages no Ar! 🚀</h1>
      <p class="text-slate-400 text-sm">
        Se você está vendo esta página, seu deploy estático foi concluído com sucesso.
      </p>
    </div>

    <!-- Contador interativo para teste de JavaScript -->
    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/50 space-y-3">
      <p class="text-xs uppercase tracking-wider text-slate-400 font-medium">Teste de Interatividade (JS)</p>
      <div id="counter" class="text-3xl font-extrabold text-indigo-400">0</div>
      <button 
        id="btnClick"
        class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition-all rounded-lg font-medium text-white shadow-lg shadow-indigo-600/20"
      >
        Clique para testar
      </button>
    </div>

    <footer class="pt-2 border-t border-slate-700/50 text-xs text-slate-500">
      Arquivo: <code class="text-indigo-300">index.html</code> no branch principal.
    </footer>
  </main>

  <script>
    let count = 0;
    const counterDisplay = document.getElementById('counter');
    const button = document.getElementById('btnClick');

    button.addEventListener('click', () => {
      count++;
      counterDisplay.textContent = count;
    });
  </script>
</body>
</html>
